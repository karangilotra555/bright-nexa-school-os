name: Isolated security branch checks
on:
  push:
    branches:
      - fix/security-legacy-api-route-20261113
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check release integrity
        run: npm run build
      - name: Run all regression and security tests
        run: npm test
