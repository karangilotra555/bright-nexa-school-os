name: One-time teacher app invite UI build
on:
  push:
    branches: [fix/teacher-invite-from-profile-20261112]
    paths:
      - app-extracted/src/BrightNexaApp.jsx
      - .github/workflows/teacher-invite-build.yml
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/build-school-ui.cjs
      - run: node --test tests/teacher-faculty-invite.test.cjs
      - run: npm run build
      - name: Save release bundles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/index-brightnexa-v2.js docs/assets/index-brightnexa-v2.js app-extracted/dist/assets/index-brightnexa-v2.js sw.js docs/sw.js app-extracted/dist/sw.js
          if ! git diff --cached --quiet; then
            git commit -m "Build teacher invitation UI artifacts and precache revisions"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - run: npm test
