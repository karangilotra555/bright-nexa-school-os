name: One-time class setup source repair
on:
  push:
    branches: [fix/class-setup-subjects-and-reset-20261110]
jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Apply focused original-source patch and rebuild the three UI bundles
        run: |
          git apply --check patches/class-setup-20261110.patch
          git apply patches/class-setup-20261110.patch
          node scripts/build-school-ui.cjs
          node --test tests/class-setup-reset.test.cjs
      - name: Preserve literal browser-save-error labels after source compilation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          labels = ('School profile','Student records','ERP operations')
          for root in (Path('.'), Path('docs'), Path('app-extracted/dist')):
              bundle = root / 'assets/index-brightnexa-v2.js'
              content = bundle.read_text()
              for label in labels:
                  # The old checked-in bundle used single quotes; esbuild may emit backticks.
                  content = re.sub(r'bnReportBrowserSaveError\((?:"|`)' + re.escape(label) + r'(?:"|`)',"bnReportBrowserSaveError('" + label + "'",content)
                  assert "bnReportBrowserSaveError('" + label + "'" in content, (root,label)
              bundle.write_text(content)
              sha=hashlib.sha256(content.encode()).hexdigest()
              sw=root / 'sw.js'
              original=sw.read_text()
              updated,n=re.subn(r'(url:"assets/index-brightnexa-v2.js",revision:)"[0-9a-f]+"', lambda m:m.group(1)+'"'+sha+'"',original)
              assert n==1,(sw,n)
              sw.write_text(updated)
          PY
      - name: Run all existing regression checks
        run: |
          node --test tests/class-setup-reset.test.cjs
          npm test
      - name: Commit only the verified source and generated artifacts
        run: |
          rm .github/workflows/repair-class-setup-once.yml patches/class-setup-20261110.patch
          rmdir patches 2>/dev/null || true
          git config user.name 'Bright Nexa CI'
          git config user.email 'ci@users.noreply.github.com'
          git add -A
          git commit -m 'fix: remove subjects from class editor and allow explicit class reset'
          git push origin HEAD:fix/class-setup-subjects-and-reset-20261110
