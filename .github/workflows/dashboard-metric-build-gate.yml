name: Dashboard Metrics Build Gate
on:
  push:
    branches: [fix/dashboard-metric-overflow-20261113]
  workflow_dispatch:
concurrency:
  group: dashboard-metric-build
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dashboard-metric-overflow-20261113
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/build-school-ui.cjs
      - run: npm run build
      - run: npm test
      - name: Publish only tested PWA assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/index-brightnexa-v2.js docs/assets/index-brightnexa-v2.js app-extracted/dist/assets/index-brightnexa-v2.js sw.js docs/sw.js app-extracted/dist/sw.js
          if ! git diff --cached --quiet; then
            git commit -m "build(dashboard): refresh verified service worker precache and mirrors"
            git pull --rebase origin fix/dashboard-metric-overflow-20261113
            git push
          fi
