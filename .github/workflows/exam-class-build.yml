name: One-time exam class UI rebuild
on:
  push:
    branches:
      - fix/exam-created-classes-20261112
    paths:
      - app-extracted/src/BrightNexaApp.jsx
      - .github/workflows/exam-class-build.yml
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build generated bundles from maintained JSX
        run: node scripts/build-school-ui.cjs
      - run: npm run build
      - run: npm test
      - name: Save generated artifacts back to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/index-brightnexa-v2.js docs/assets/index-brightnexa-v2.js app-extracted/dist/assets/index-brightnexa-v2.js sw.js docs/sw.js app-extracted/dist/sw.js
          if ! git diff --cached --quiet; then
            git commit -m "Build exam-class UI and update service worker checksums"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
