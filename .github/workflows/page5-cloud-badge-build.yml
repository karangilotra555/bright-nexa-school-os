name: Page 5 Cloud Status Build
on:
  push:
    branches: [fix/page5-cloud-status-reliability-20261113]
  workflow_dispatch:
concurrency:
  group: page5-cloud-badge-build
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  cloud-status:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/page5-cloud-status-reliability-20261113
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/build-school-ui.cjs
      - run: npm run build
      - run: npm test
      - name: Publish verified ERP bundles and service worker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/index-brightnexa-v2.js docs/assets/index-brightnexa-v2.js app-extracted/dist/assets/index-brightnexa-v2.js sw.js docs/sw.js app-extracted/dist/sw.js
          if ! git diff --cached --quiet; then
            git commit -m "build(page5): publish truthful cloud status across web PWA desktop"
            git pull --rebase origin fix/page5-cloud-status-reliability-20261113
            git push
          fi
