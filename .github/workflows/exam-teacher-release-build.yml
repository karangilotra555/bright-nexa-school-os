name: Exam and teacher invitation release build
on:
  push:
    branches: [fix/exam-teacher-release-qa-20261112]
    paths:
      - app-extracted/src/BrightNexaApp.jsx
      - .github/workflows/exam-teacher-release-build.yml
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Rebuild all three mirrored assets and checksums
        run: node scripts/build-school-ui.cjs
      - name: Commit build artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/index-brightnexa-v2.js docs/assets/index-brightnexa-v2.js app-extracted/dist/assets/index-brightnexa-v2.js sw.js docs/sw.js app-extracted/dist/sw.js
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate combined release bundle and SW revision"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - run: npm run build
      - run: npm test
