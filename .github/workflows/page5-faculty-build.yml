name: Page 5 Faculty Build & Regression
on:
  push:
    branches: [fix/page5-faculty-cloud-20261113]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  page5:
    if: github.event_name != 'pull_request' || github.head_ref == 'fix/page5-faculty-cloud-20261113'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: fix/page5-faculty-cloud-20261113
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/build-school-ui.cjs
      - run: npm run build
      - run: npm test
      - name: Commit built mirrors only if checks passed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/index-brightnexa-v2.js docs/assets/index-brightnexa-v2.js app-extracted/dist/assets/index-brightnexa-v2.js sw.js docs/sw.js app-extracted/dist/sw.js
          if ! git diff --cached --quiet; then
            git commit -m "build(page5): rebuild faculty ERP bundles and PWA precache"
            git push
          fi
