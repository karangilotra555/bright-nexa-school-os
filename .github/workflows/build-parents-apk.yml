name: Build Bright Nexa School APK
on:
  push:
    branches: [main]
    paths:
      - 'android-parents/**'
      - '.github/workflows/build-parents-apk.yml'
  pull_request:
    paths:
      - 'android-parents/**'
      - '.github/workflows/build-parents-apk.yml'
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: bright-nexa-android-signing-v1
      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35'
          fi
          if [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'
          fi
      - name: Build School APK
        working-directory: android-parents
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload installable School APK
        uses: actions/upload-artifact@v4
        with:
          name: Bright-Nexa-School-APK
          path: android-parents/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish School APK
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='school-app-v0.4.0'
          cp android-parents/app/build/outputs/apk/debug/app-debug.apk Bright-Nexa-School-v0.4.0.apk
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$tag" Bright-Nexa-School-v0.4.0.apk --clobber --repo "${{ github.repository }}"
          else
            gh release create "$tag" Bright-Nexa-School-v0.4.0.apk --repo "${{ github.repository }}" --target "${{ github.sha }}" --prerelease --title 'Bright Nexa School App v0.4.0' --notes 'Teacher and student logins, homework photo/PDF file picker, in-app PDF and image viewer, and attendance calendar. The old demo APK used a temporary signing key; uninstall it first if Android reports a signing conflict. Cloud records are preserved.'
          fi
