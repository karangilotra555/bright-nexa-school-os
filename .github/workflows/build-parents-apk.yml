name: Build Bright Nexa School APK
on:
  push:
    branches: [main]
    paths:
      - 'android-parents/**'
      - 'android-shared/**'
      - '.github/workflows/build-parents-apk.yml'
  pull_request:
    paths:
      - 'android-parents/**'
      - 'android-shared/**'
      - '.github/workflows/build-parents-apk.yml'
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: bright-nexa-android-signing-v1
      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35'
          fi
          if [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'
          fi
      - name: Build School APK
        env:
          FCM_APP_ID: ${{ vars.FCM_APP_ID }}
          FCM_API_KEY: ${{ vars.FCM_API_KEY }}
          FCM_SENDER_ID: ${{ vars.FCM_SENDER_ID }}
          FCM_PROJECT_ID: ${{ vars.FCM_PROJECT_ID }}
        working-directory: android-parents
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload installable School APK
        uses: actions/upload-artifact@v4
        with:
          name: Bright-Nexa-School-APK
          path: android-parents/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish School APK
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          FCM_APP_ID: ${{ vars.FCM_APP_ID }}
          FCM_API_KEY: ${{ vars.FCM_API_KEY }}
          FCM_SENDER_ID: ${{ vars.FCM_SENDER_ID }}
          FCM_PROJECT_ID: ${{ vars.FCM_PROJECT_ID }}
        run: |
          tag='school-app-v0.5.4'
          for key in FCM_APP_ID FCM_API_KEY FCM_SENDER_ID FCM_PROJECT_ID; do
            if [ -z "${!key}" ]; then
              echo "::error::Configure repository variable $key before publishing the push-capable APK."
              exit 1
            fi
          done
          cp android-parents/app/build/outputs/apk/debug/app-debug.apk Bright-Nexa-School-v0.5.4.apk
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$tag" Bright-Nexa-School-v0.5.4.apk --clobber --repo "${{ github.repository }}"
          else
            gh release create "$tag" Bright-Nexa-School-v0.5.4.apk --repo "${{ github.repository }}" --target "${{ github.sha }}" --prerelease --title 'Bright Nexa School App v0.5.4' --notes 'Fixes the WhatsApp draft handoff on Bright Nexa Leadership. Teacher, parent and student portals remain available.'
          fi
