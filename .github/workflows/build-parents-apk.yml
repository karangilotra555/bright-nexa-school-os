name: Build Parents Android APK
on:
  pull_request:
    paths:
      - 'android-parents/**'
      - '.github/workflows/build-parents-apk.yml'
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35'
          fi
          if [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'
          fi
      - name: Build demo APK
        working-directory: android-parents
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload installable demo APK
        uses: actions/upload-artifact@v4
        with:
          name: Bright-Nexa-Parents-demo-APK
          path: android-parents/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
