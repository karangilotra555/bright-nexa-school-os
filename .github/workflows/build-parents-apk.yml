name: Build Parents Android APK
on:
  pull_request:
    paths:
      - 'android-parents/**'
      - '.github/workflows/build-parents-apk.yml'
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build demo APK
        working-directory: android-parents
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload installable demo APK
        uses: actions/upload-artifact@v4
        with:
          name: Bright-Nexa-Parents-demo-APK
          path: android-parents/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
