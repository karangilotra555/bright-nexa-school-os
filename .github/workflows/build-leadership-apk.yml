name: Build Bright Nexa Leadership APK
on:
  pull_request:
    paths:
      - 'android-leadership/**'
      - 'android-shared/**'
      - '.github/workflows/build-leadership-apk.yml'
      - 'leadership.html'
      - 'leadership-app.js'
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Prepare Android SDK
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35'
          fi
          if [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'
          fi
      - name: Build installable review APK
        env:
          FCM_APP_ID: ${{ vars.FCM_LEADERSHIP_APP_ID }}
          FCM_API_KEY: ${{ vars.FCM_LEADERSHIP_API_KEY || vars.FCM_API_KEY }}
          FCM_SENDER_ID: ${{ vars.FCM_SENDER_ID }}
          FCM_PROJECT_ID: ${{ vars.FCM_PROJECT_ID }}
        working-directory: android-leadership
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload leadership review APK
        uses: actions/upload-artifact@v4
        with:
          name: Bright-Nexa-Leadership-Review-APK
          path: android-leadership/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
