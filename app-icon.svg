<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071a36" />
      <stop offset="60%" stop-color="#0b2447" />
      <stop offset="100%" stop-color="#040d1a" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="14" y="14" width="484" height="484" rx="98" fill="none" stroke="url(#cyanGrad)" stroke-width="4" opacity="0.35"/>

  <!-- Glowing Outer Emblem Ring -->
  <circle cx="256" cy="220" r="138" fill="#081e3d" stroke="url(#cyanGrad)" stroke-width="6" opacity="0.9"/>
  <circle cx="256" cy="220" r="126" fill="none" stroke="url(#amberGrad)" stroke-width="3" opacity="0.6"/>

  <!-- Modern BN Monogram -->
  <g filter="url(#glow)">
    <!-- Letter B in Cyan -->
    <text x="210" y="260" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="130" font-weight="900" fill="url(#cyanGrad)" letter-spacing="-4">B</text>
    <!-- Letter N in Gold -->
    <text x="300" y="260" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="130" font-weight="900" fill="url(#amberGrad)" letter-spacing="-4">N</text>
  </g>

  <!-- Graduation Cap Icon Accent -->
  <path d="M256 122 L308 144 L256 166 L204 144 Z" fill="url(#cyanGrad)"/>
  <path d="M224 153 L224 182 Q256 198 288 182 L288 153" fill="none" stroke="url(#cyanGrad)" stroke-width="6" stroke-linecap="round"/>
  <path d="M304 146 L316 172" stroke="url(#amberGrad)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="316" cy="176" r="4" fill="#fbbf24"/>

  <!-- Brand Typography -->
  <text x="256" y="415" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="4">BRIGHT NEXA</text>
  
  <!-- Subtitle Badge -->
  <rect x="176" y="435" width="160" height="30" rx="15" fill="#0369a1" opacity="0.4"/>
  <text x="256" y="456" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#38bdf8" letter-spacing="3">SCHOOL OS</text>
</svg>
