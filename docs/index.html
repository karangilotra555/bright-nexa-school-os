    <script>
(function(){
  // Hosted users have one login route. Never make them create/import a school
  // before they can sign in; the backend still checks membership and role.
  try{
    if(location.protocol!=='https:' || ['localhost','127.0.0.1'].includes(location.hostname))return;
    const hash=new URLSearchParams(location.hash.replace(/^#/,''));
    const callback=(hash.has('access_token')&&hash.has('refresh_token'))||hash.has('error');
    const session=JSON.parse(sessionStorage.getItem('bn_school_staff_session_v1')||'null');
    if(!callback&&session&&typeof session.access_token==='string'&&session.access_token)return;
    const target=new URL('./teacher-access.html',location.href);
    if(callback)target.hash=location.hash;
    location.replace(target.href);
  }catch(error){
    location.replace(new URL('./teacher-access.html',location.href).href);
  }
})();
    </script>
    <script>
if (window.location.pathname.includes('marksheet') || window.location.pathname.includes('id-card') || window.location.pathname.includes('tc-certificate') || window.location.pathname.includes('student-portal')) {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function(regs) {
      if (regs.length > 0) {
        for (let r of regs) r.unregister();
        window.location.reload();
      }
    });
  }
}

// Opening a full ERP school requires the application's normal authentication
// flow or the explicit openSchool URL from verified School Admin routing.
// Merely having any saved staff token must NOT auto-open the admin interface.
const CACHE_VERSION = '20261113-cloud-photo-v1';
if (window.localStorage && window.localStorage.getItem('bn_sw_cleared') !== CACHE_VERSION) {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function(registrations) {
      for (let registration of registrations) registration.unregister();
    });
  }
  if ('caches' in window) {
    caches.keys().then(function(names) { for (let name of names) caches.delete(name); });
  }
  try { window.localStorage.setItem('bn_sw_cleared', CACHE_VERSION); } catch(e){}
}
</script>
