<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta http-equiv="Referrer-Policy" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://mrfvbwmyxndrakskqyas.supabase.co; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>Reset Student Password — Bright Nexa</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#102640;background:#f3f7fb}*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:22px}
main{background:#fff;border:1px solid #dce6ef;border-radius:22px;padding:28px 22px;width:min(460px,100%);box-shadow:0 9px 32px #07305618}
h1{font-size:23px;margin:0 0 12px;color:#061a36}p{font-size:13px;color:#64758a;line-height:1.55}
label{display:block;font-size:13px;font-weight:750;margin:14px 0 7px}
input{display:block;width:100%;border-radius:12px;border:1px solid #dce6ef;padding:13px;font:inherit}
button{width:100%;margin-top:19px;background:#138ed8;border:0;border-radius:12px;color:#fff;padding:14px;font:inherit;font-weight:800;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
a{display:block;margin-top:20px;font-size:13px;text-align:center;color:#0b315e}
.error{color:#b22c44}.success{color:#096b40}
</style>
</head><body>
<main>
<h1>Reset student password</h1>
<p>Open this page from the secure email link sent to the guardian email registered with the school. Enter the student's admission number and a new password.</p>
<div id="notice" role="status" aria-live="polite"></div>
<form id="resetForm">
<label for="admission">Student admission number</label>
<input id="admission" autocomplete="username" maxlength="64" required>
<label for="password">New password (12+ characters)</label>
<input id="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
<label for="confirm">Confirm new password</label>
<input id="confirm" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
<button id="save" type="submit">Set new password</button>
</form>
<a href="./parents.html">Back to Student / Parent Login</a>
</main>
<script>
(()=>{'use strict';
const BASE='https://mrfvbwmyxndrakskqyas.supabase.co';
const APIKEY='sb_publishable_qnOuxnbwCKcPbxpVMz3QTQ_9jAjLGGT';
const SCHOOL='bc80e32d-485d-48a8-903a-92338aa61005';
const $=id=>document.getElementById(id);
const fragment=new URLSearchParams(location.hash.slice(1));
let token=fragment.get('access_token');
const type=fragment.get('type');
history.replaceState(null,'',location.pathname+location.search);
function status(message,error=false){$('notice').textContent=message;$('notice').className=error?'error':'success';}
if(!token||!['magiclink','email'].includes(type)){
 token=null;$('resetForm').hidden=true;
 status('This recovery link is missing or expired. Request a new email link from Student / Parent Login.',true);
}
$('resetForm').addEventListener('submit',async e=>{
 e.preventDefault();
 if(!token)return;
 const password=$('password').value,confirm=$('confirm').value;
 if(password!==confirm){status('New passwords do not match.',true);return;}
 if(password.length<12||password.length>128||!/[a-z]/i.test(password)||!/[0-9]/.test(password)){
  status('Use 12–128 characters with letters and numbers.',true);return;
 }
 const button=$('save');
 button.disabled=true;
 try{
  const schoolId=new URLSearchParams(location.search).get('school')||SCHOOL;
  const response=await fetch(BASE+'/functions/v1/school-student-login',{
   method:'POST',headers:{apikey:APIKEY,Authorization:'Bearer '+token,'Content-Type':'application/json'},
   body:JSON.stringify({action:'complete-reset',admissionNumber:$('admission').value.trim(),schoolId,newPassword:password}),
   cache:'no-store'
  });
  const payload=await response.json().catch(()=>({}));
  if(!response.ok)throw Error(payload.error||'Unable to reset password. Contact the school office.');
  token=null;
  $('resetForm').reset();
  $('resetForm').hidden=true;
  status('Password updated. Return to Student / Parent Login and sign in with the new password.');
 }catch(err){status(err.message||'Unable to reset password. Contact the school office.',true);}
 finally{button.disabled=false;}
});
})();
</script>
</body></html>
